<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | 阿洛娜指纹识别2.0</title>
    <style>
      /* 全局重置，确保没有任何边距和滚动条 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;        /* 禁止滚动条 */
        background: #000;
      }
      /* 画布容器填满视口 */
      #unity-canvas {
        width: 100vw !important;
        height: 100vh !important;
        display: block;
        background: #231F20;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script src="Build/4k0.1.loader.js"></script>
    <script>
      // 移动端适配（保留原逻辑）
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        // 移动端无需额外操作，因为CSS已经全屏
      }

      // 加载Unity实例（原样保留）
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/4k0.1.data",
        frameworkUrl: "Build/4k0.1.framework.js",
        codeUrl: "Build/4k0.1.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "卡尔莫钦",
        productName: "阿洛娜指纹识别2.0",
        productVersion: "2.0",
        // matchWebGLToCanvasSize: false, // 保持注释，让canvas自动拉伸
        // devicePixelRatio: 1, // 如果需要高DPI可取消注释
      });
    </script>
	<script>
  // AronaAudioLevelV2: Wallpaper Engine 桌面音频监听（普通浏览器无此 API，静默跳过）
  if (typeof window.wallpaperRegisterAudioListener === 'function') {
    window.__AronaAudioLevel = 0;
    window.wallpaperRegisterAudioListener(function(audioArray) {
      if (!audioArray || audioArray.length === 0) return;
      var sumSq = 0;
      for (var i = 0; i < audioArray.length; i++) {
        var v = audioArray[i];
        if (v < 0) v = 0;
        if (v > 1) v = 1;
        sumSq += v * v;
      }
      var rms = Math.sqrt(sumSq / audioArray.length);
      window.__AronaAudioLevel = Math.round(Math.min(rms, 1) * 10000);
    });
  }
</script>
  </body>
</html>
