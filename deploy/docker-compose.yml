name: classschedule

services:
  db:
    image: postgres:17-alpine
    container_name: classschedule_db
    restart: always
    environment:
      POSTGRES_USER: class_schedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: class_schedule
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U class_schedule -d class_schedule"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: classschedule-app:latest
    container_name: classschedule_app
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://class_schedule:${POSTGRES_PASSWORD}@db:5432/class_schedule
      JWT_SECRET: ${JWT_SECRET}
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-demo}
      DEFAULT_EMAIL: ${DEFAULT_EMAIL:-demo@example.com}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?生产环境必须设置 DEFAULT_PASSWORD}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      # AI 课表解析（OpenAI 兼容协议）；AI_API_KEY 留空则自动回退本地 Excel 解析
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-60000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW_SECONDS: ${AUTH_RATE_WINDOW_SECONDS:-300}
      TRUST_PROXY_HEADERS: "true"
    volumes:
      # 数据目录持久化到宿主机（上传的课表文件解析完即删，不再长期留存）
      - ../data:/app/data
      # 静态文件目录挂载（APK 下载包与图片资源）
      - ../static:/app/static
      # 前端构建产物挂载（网页端直出，git pull 后无需重建镜像即可实时热更生效）
      - ../frontend/dist:/app/frontend/dist
    ports:
      # 仅绑定本机回环，由外层反向代理（如 Nginx）统一对外暴露
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
