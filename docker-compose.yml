services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: class_schedule
      POSTGRES_USER: class_schedule
      POSTGRES_PASSWORD: class_schedule
    ports: ["5433:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U class_schedule"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pg_data:
